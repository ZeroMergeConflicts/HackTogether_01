name: Bug Report
description: Report a reproducible bug
title: "[Bug]: "
labels: ["bug"]
body:

* type: textarea
  id: description
  attributes:
  label: What happened?
  description: Briefly describe the bug.
  validations:
  required: true

* type: textarea
  id: steps
  attributes:
  label: Steps to reproduce
  description: Tell us how to reproduce the issue.
  placeholder: |
  1. ...
  2. ...
  3. ...
  validations:
  required: true

* type: textarea
  id: expected
  attributes:
  label: Expected behavior
  validations:
  required: true

* type: textarea
  id: environment
  attributes:
  label: Environment
  description: OS, browser, version, or other relevant details.
  validations:
  required: false
